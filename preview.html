<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>508 公車桌鐘</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#05070a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif
}
main{
  width:100vw;height:100vh;
  display:grid;grid-template-columns:48% 52%;
  gap:12px;padding:12px;
  background:linear-gradient(180deg,#07090d,#030405)
}
.card{
  border:1px solid #232b36;
  border-radius:24px;
  background:#0d1117
}
.clock{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center
}
#time{
  font-size:clamp(72px,13vw,150px);
  font-weight:760;
  line-height:.9;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}
#sec{
  font-size:.22em;
  color:#8e99a8;
  margin-left:.12em;
  vertical-align:top;
  letter-spacing:0
}
#date{
  margin-top:22px;
  font-size:clamp(18px,2.7vw,30px);
  color:#d6dee9;
  font-weight:600
}
.bus{
  padding:24px;
  display:flex;
  flex-direction:column
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.route{
  font-size:clamp(36px,5.5vw,62px);
  font-weight:850;
  background:#f8fafc;
  color:#111827;
  border-radius:16px;
  padding:10px 16px;
  line-height:1
}
.dir{
  text-align:right
}
.dir small{
  display:block;
  color:#8e99a8;
  font-size:13px
}
.dir strong{
  font-size:clamp(19px,2.8vw,30px)
}
.stop{
  margin-top:22px;
  color:#b7c0cc;
  font-size:clamp(16px,2.2vw,22px)
}
.stop b{color:#fff}
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center
}
.label{
  font-size:14px;
  color:#8e99a8;
  margin-bottom:5px
}
#eta{
  font-size:clamp(58px,9vw,104px);
  font-weight:850;
  letter-spacing:-.05em;
  line-height:1
}
#sub{
  margin-top:12px;
  color:#c9d3df;
  font-size:clamp(14px,1.9vw,19px)
}
.footer{
  border-top:1px solid #232b36;
  padding-top:12px;
  color:#8e99a8;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:8px
}
.ok{color:#86efac}
.warn{color:#fde68a}
.bad{color:#fca5a5}

@media(orientation:portrait){
  main{
    grid-template-columns:1fr;
    grid-template-rows:39% 61%
  }
  #time{font-size:clamp(72px,22vw,130px)}
  #date{margin-top:12px}
}
</style>
</head>

<body>
<main>

<section class="card clock">
  <div id="time">--:--<span id="sec">--</span></div>
  <div id="date">--</div>
</section>

<section class="card bus">

  <div class="top">
    <div class="route">508</div>
    <div class="dir">
      <small>方向</small>
      <strong>往 大同之家</strong>
    </div>
  </div>

  <div class="stop">
    站牌　<b>憲兵學校</b>
  </div>

  <div class="center">
    <div class="label">預估到站</div>
    <div id="eta">連線中…</div>
    <div id="sub">正在讀取即時公車資料</div>
  </div>

  <div class="footer">
    <span id="status">等待資料</span>
    <span id="updated">--:--:--</span>
  </div>

</section>
</main>

<script>
(function(){

  var WORKER =
    "https://508-bus.teddy-chin24.workers.dev/";

  function pad(n){
    return ("0"+n).slice(-2);
  }

  function updateClock(){
    var d=new Date();

    document.getElementById("time").innerHTML =
      pad(d.getHours())+":"+pad(d.getMinutes())+
      '<span id="sec">'+pad(d.getSeconds())+"</span>";

    var days=[
      "星期日","星期一","星期二",
      "星期三","星期四","星期五","星期六"
    ];

    document.getElementById("date").textContent =
      (d.getMonth()+1)+" 月 "+d.getDate()+" 日　"+
      days[d.getDay()];
  }

  function showStatus(v){

    var eta=document.getElementById("eta");
    var sub=document.getElementById("sub");

    eta.className="";

    if(!v){
      eta.textContent="無資料";
      eta.className="warn";
      sub.textContent="目前沒有到站預估";
      return;
    }

    eta.textContent=v;

    var m=v.match(/^(\d+)分$/);

    if(m){
      var n=parseInt(m[1],10);

      if(n<=5){
        eta.className="ok";
      }

      sub.textContent =
        n<=2 ? "建議準備出門" :
        "即時公車預估";

      return;
    }

    if(
      v.indexOf("即將到站")>=0 ||
      v.indexOf("將到站")>=0 ||
      v.indexOf("進站中")>=0
    ){
      eta.className="ok";
      sub.textContent="車輛已接近本站";
      return;
    }

    eta.className="warn";
    sub.textContent="目前沒有一般倒數時間";
  }

  async function refresh(){

    var status=document.getElementById("status");
    var updated=document.getElementById("updated");

    status.textContent="更新中…";
    status.className="";

    try{

      var r=await fetch(
        WORKER+"?t="+Date.now(),
        {cache:"no-store"}
      );

      if(!r.ok){
        throw new Error("HTTP "+r.status);
      }

      var data=await r.json();

      if(data.error){
        throw new Error(data.error);
      }

      showStatus(data.status);

      var d=new Date();

      status.textContent="Cloudflare 即時資料";
      status.className="ok";

      updated.textContent =
        pad(d.getHours())+":"+
        pad(d.getMinutes())+":"+
        pad(d.getSeconds());

    }catch(e){

      document.getElementById("eta").textContent=
        "讀取失敗";

      document.getElementById("eta").className=
        "bad";

      document.getElementById("sub").textContent=
        "錯誤："+(e.message||e);

      status.textContent=
        "Worker 連線失敗";

      status.className="bad";
    }
  }

  updateClock();
  setInterval(updateClock,1000);

  refresh();
  setInterval(refresh,30000);

  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){
      updateClock();
      refresh();
    }
  });

})();
</script>
</body>
</html>
