<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>508 公車桌鐘</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#05070a;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif
}
main{
  width:100vw;height:100vh;
  display:grid;grid-template-columns:minmax(0,48fr) minmax(0,52fr);
  gap:12px;padding:12px;
  background:linear-gradient(180deg,#07090d,#030405)
}
.card{
  border:1px solid #232b36;
  border-radius:24px;
  background:#0d1117
}
.clock{
  position:relative;min-width:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center
}
#time{
  font-size:clamp(72px,13vw,150px);
  font-weight:760;
  line-height:.9;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap
}
#sec{
  font-size:.22em;
  color:#8e99a8;
  margin-left:.12em;
  vertical-align:top;
  letter-spacing:0
}
#date{
  margin-top:22px;
  font-size:clamp(18px,2.7vw,30px);
  color:#d6dee9;
  font-weight:600
}
.bus{
  padding:24px;
  display:flex;
  flex-direction:column
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.route{
  font-size:clamp(36px,5.5vw,62px);
  font-weight:850;
  background:#f8fafc;
  color:#111827;
  border-radius:16px;
  padding:10px 16px;
  line-height:1
}
.dir{
  text-align:right
}
.dir small{
  display:block;
  color:#8e99a8;
  font-size:13px
}
.dir strong{
  font-size:clamp(19px,2.8vw,30px)
}
.stop{
  margin-top:22px;
  color:#b7c0cc;
  font-size:clamp(16px,2.2vw,22px)
}
.stop b{color:#fff}
.center{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center
}
.label{
  font-size:14px;
  color:#8e99a8;
  margin-bottom:5px
}
#eta{
  font-size:clamp(58px,9vw,104px);
  font-weight:850;
  letter-spacing:-.05em;
  line-height:1
}
#sub{
  margin-top:12px;
  color:#c9d3df;
  font-size:clamp(14px,1.9vw,19px)
}
.footer{
  border-top:1px solid #232b36;
  padding-top:12px;
  color:#8e99a8;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:8px
}
.ok{color:#86efac}
.warn{color:#fde68a}
.bad{color:#fca5a5}

@media(orientation:portrait){
  main{
    grid-template-columns:1fr;
    grid-template-rows:39% 61%
  }
  #time{font-size:clamp(72px,22vw,130px)}
  #date{margin-top:12px}
}

/* A single button switches between the commute display and a quiet desk clock. */
.mode-toggle{
  position:absolute;top:14px;left:14px;z-index:2;
  min-height:44px;padding:10px 14px;
  border:1px solid #343b45;border-radius:999px;
  background:#171d25;color:#d6dee9;
  font:500 13px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent
}
.mode-toggle:focus-visible{outline:2px solid #ffc16a;outline-offset:4px}
.mode-toggle:active{background:#303743}
.clock-only main{
  display:flex;padding:0;gap:0;background:#000
}
.clock-only .clock{
  width:100%;height:100%;border:0;border-radius:0;background:#000;
  padding:64px 24px 40px
}
.clock-only .bus{display:none}
.clock-only #time{
  font-size:min(29vw,62vh);font-weight:700;
  letter-spacing:-.055em;line-height:.95;color:#ffc16a
}
.clock-only #sec{display:none}
.clock-only #date{
  margin-top:24px;font-size:clamp(16px,3vw,32px);
  font-weight:500;letter-spacing:.06em;color:#b38b58
}
.clock-only .mode-toggle{
  left:auto;right:18px;top:14px;
  background:#15120e;border-color:#463521;color:#d8b17c
}
@supports(padding:env(safe-area-inset-top)){
  .clock-only .mode-toggle{
    top:calc(14px + env(safe-area-inset-top));
    right:calc(18px + env(safe-area-inset-right))
  }
  .clock-only .clock{
    padding-left:calc(24px + env(safe-area-inset-left));
    padding-right:calc(24px + env(safe-area-inset-right))
  }
}
@media(orientation:portrait){
  .clock-only #time{font-size:29vw}
  .clock-only #date{font-size:clamp(16px,4.5vw,26px)}
}
@media(max-height:360px) and (orientation:landscape){
  .clock-only .clock{padding-top:54px;padding-bottom:20px}
  .clock-only #time{font-size:min(27vw,54vh)}
  .clock-only #date{margin-top:14px;font-size:18px}
}
</style>
</head>

<body>
<main>

<section class="card clock" aria-label="時鐘">
  <button id="mode-toggle" class="mode-toggle" type="button"
    aria-pressed="false" aria-controls="bus-panel">滿版時鐘</button>
  <div id="time">--:--<span id="sec">--</span></div>
  <div id="date">--</div>
</section>

<section id="bus-panel" class="card bus" aria-label="508 公車即時到站">

  <div class="top">
    <div class="route">508</div>
    <div class="dir">
      <small>方向</small>
      <strong>往 大同之家</strong>
    </div>
  </div>

  <div class="stop">
    站牌　<b>憲兵學校</b>
  </div>

  <div class="center">
    <div class="label">預估到站</div>
    <div id="eta">連線中…</div>
    <div id="sub">正在讀取即時公車資料</div>
  </div>

  <div class="footer">
    <span id="status">等待資料</span>
    <span id="updated">--:--:--</span>
  </div>

</section>
</main>

<script>
(function(){

  var WORKER =
    "https://508-bus.teddy-chin24.workers.dev/";

  var clockOnly=false;
  var modeButton=document.getElementById("mode-toggle");
  try{
    clockOnly=localStorage.getItem("508-clock-display-mode")==="clock";
  }catch(e){}

  function applyDisplayMode(){
    document.body.classList.toggle("clock-only",clockOnly);
    modeButton.textContent=clockOnly ? "顯示公車" : "滿版時鐘";
    modeButton.setAttribute("aria-pressed",String(clockOnly));
    modeButton.setAttribute("aria-label",clockOnly ? "切換為時鐘與公車時刻" : "切換為滿版時鐘");
    document.getElementById("bus-panel").setAttribute("aria-hidden",String(clockOnly));
  }

  modeButton.addEventListener("click",function(){
    clockOnly=!clockOnly;
    applyDisplayMode();
    try{
      localStorage.setItem("508-clock-display-mode",clockOnly ? "clock" : "bus");
    }catch(e){}
    updateClock();
    if(!clockOnly){refresh();}
  });
  applyDisplayMode();

  function pad(n){
    return ("0"+n).slice(-2);
  }

  function updateClock(){
    var d=new Date();

    document.getElementById("time").innerHTML =
      pad(d.getHours())+":"+pad(d.getMinutes())+
      '<span id="sec">'+pad(d.getSeconds())+"</span>";

    var days=[
      "星期日","星期一","星期二",
      "星期三","星期四","星期五","星期六"
    ];

    document.getElementById("date").textContent =
      (d.getMonth()+1)+" 月 "+d.getDate()+" 日　"+
      days[d.getDay()];
  }

  function showStatus(v){

    var eta=document.getElementById("eta");
    var sub=document.getElementById("sub");

    eta.className="";

    if(!v){
      eta.textContent="無資料";
      eta.className="warn";
      sub.textContent="目前沒有到站預估";
      return;
    }

    eta.textContent=v;

    var m=v.match(/^(\d+)分$/);

    if(m){
      var n=parseInt(m[1],10);

      if(n<=5){
        eta.className="ok";
      }

      sub.textContent =
        n<=2 ? "建議準備出門" :
        "即時公車預估";

      return;
    }

    if(
      v.indexOf("即將到站")>=0 ||
      v.indexOf("將到站")>=0 ||
      v.indexOf("進站中")>=0
    ){
      eta.className="ok";
      sub.textContent="車輛已接近本站";
      return;
    }

    eta.className="warn";
    sub.textContent="目前沒有一般倒數時間";
  }

  async function refresh(){
    if(clockOnly || document.hidden){return;}

    var status=document.getElementById("status");
    var updated=document.getElementById("updated");

    status.textContent="更新中…";
    status.className="";

    try{

      var r=await fetch(
        WORKER+"?t="+Date.now(),
        {cache:"no-store"}
      );

      if(!r.ok){
        throw new Error("HTTP "+r.status);
      }

      var data=await r.json();

      if(data.error){
        throw new Error(data.error);
      }

      showStatus(data.status);

      var d=new Date();

      status.textContent="Cloudflare 即時資料";
      status.className="ok";

      updated.textContent =
        pad(d.getHours())+":"+
        pad(d.getMinutes())+":"+
        pad(d.getSeconds());

    }catch(e){

      document.getElementById("eta").textContent=
        "讀取失敗";

      document.getElementById("eta").className=
        "bad";

      document.getElementById("sub").textContent=
        "錯誤："+(e.message||e);

      status.textContent=
        "Worker 連線失敗";

      status.className="bad";
    }
  }

  updateClock();
  setInterval(updateClock,1000);

  refresh();
  setInterval(refresh,30000);

  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){
      updateClock();
      refresh();
    }
  });

})();
</script>
</body>
</html>
